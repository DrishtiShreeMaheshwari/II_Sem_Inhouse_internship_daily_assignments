<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Drishti's Sample College Admission Form</title>
    </head>
    <meta charset=""UTF-8">
    <body>
        <h1 style="text-align: center; color:  #000000; background-color: rgb(106, 224, 224); border-color: black;border-radius: 8px; ">COLLEGE ADMISSION FORM</h1>
        <h2>Personal Information</h2>
            <form>
                <label>Full Name</label><br><br>
                <input type="text" placeholder="Enter your Full Name" required><br><br>
                <label>Date of Birth</label><br><br>
                <input type="date" required><br><br>
                <label>Gender</label><br><br>
                <input type="radio" name="gender" value="Male" required>Male
                <input type="radio" name="gender" value="Female">Female
                <input type="radio" name="gender" value="Other">Other<br><br>
                <label>Nationality</label>
                <select id="nationality" name="nationality" required>
                    <option value="indian">Indian</option>
                    <option value="american">American</option>
                    <option value="british">British</option>
                    <option value="japanese">Japanese</option>
                    <option value="korean">Korean</option>
                </select>
        <h2>Contact Information</h2>
                   <label>Mobile No. :</label><br><br>
                   <input type="tel" placeholder="e.g.9876543210" required><br><br>
                   <label>E-mail</label><br><br>
                   <input type="email" placeholder="E-mail"><br><br>
        <h2>Academic Details</h2>
                   <label>Last School Attended:</label><br><br>
                   <input type="text" placeholder="School Name"><br><br>
                   <label>Standard X Pecentage:</label><br><br>
                   <input type="text" placeholder="Enter Percentage"><br><br>
                   <label>Standard XII Stream:</label><br><br>
                   <input type="text" placeholder="Enter Stream"><br><br>
                   <label>Standard XII Pecentage:</label><br><br>
                   <input type="text" placeholder="Enter Percentage"><br><br><br><br>
                   <button type="submit" style="background-color: blue;color: aliceblue;box-shadow: #000000;">SUBMIT APPLICATION</button>
            </form>
    </body>
</html>
