<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drishti's Sample College Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(106, 224, 224);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h1 {
            color: #000000;
            margin: 0;
            font-size: 24px;
            flex-grow: 1;
            text-align: center;
        }
        #toggleBtn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid rgb(106, 224, 224);
            padding-bottom: 5px;
            margin-top: 25px;
            transition: color 0.3s;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .radio-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"],
        input[type="date"],
        input[type="tel"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
            color: #000;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: rgb(74, 218, 247);
            color: rgb(255, 255, 255);
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }
        button[type="submit"]:hover {
            background-color: #0000b3;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            font-weight: bold;
        }
        body.dark {
            background-color: #121212;
            color: #f1f1f1;
        }
        body.dark .form-container {
            background-color: #1e1e1e;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.05);
        }
        body.dark h2 {
            color: #ffffff;
        }
        body.dark input[type="text"],
        body.dark input[type="date"],
        body.dark input[type="tel"],
        body.dark input[type="email"],
        body.dark select {
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #555;
        }
        body.dark #toggleBtn {
            background-color: #f4f7f6;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header-container">
            <h1>COLLEGE ADMISSION FORM</h1>
            <button type="button" id="toggleBtn">🌙 Dark</button>
        </div>
        <form id="admissionForm">
            <h2>Personal Information</h2>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your Full Name">
                <div id="nameError" class="error-msg"></div>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
                <div id="dobError" class="error-msg"></div>
            </div>
            <div class="form-group radio-group">
                <label style="display: block; font-weight: bold;">Gender</label>
                <input type="radio" name="gender" value="Male" id="male"><label for="male">Male</label>
                <input type="radio" name="gender" value="Female" id="female"><label for="female">Female</label>
                <input type="radio" name="gender" value="Other" id="other"><label for="other">Other</label>
                <div id="genderError" class="error-msg"></div>
            </div>
            <div class="form-group">
                <label for="nationality">Nationality</label>
                <select id="nationality" name="nationality">
                    <option value="">Select Nationality</option>
                    <option value="indian">Indian</option>
                    <option value="american">American</option>
                    <option value="british">British</option>
                    <option value="japanese">Japanese</option>
                    <option value="korean">Korean</option>
                </select>
                <div id="nationalityError" class="error-msg"></div>
            </div>
            <h2>Contact Information</h2>
            <div class="form-group">
                <label for="mobile">Mobile No. :</label>
                <input type="tel" id="mobile" placeholder="e.g.9876543210">
                <div id="mobileError" class="error-msg"></div>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="E-mail">
                <div id="emailError" class="error-msg"></div>
            </div>
            <h2>Academic Details</h2>
            <div class="form-group">
                <label>Last School Attended:</label>
                <input type="text" placeholder="School Name">
            </div>
            <div class="form-group">
                <label>Standard X Percentage:</label>
                <input type="text" placeholder="Enter Percentage">
            </div>
            <div class="form-group">
                <label>Standard XII Stream:</label>
                <input type="text" placeholder="Enter Stream">
            </div>
            <div class="form-group">
                <label>Standard XII Percentage:</label>
                <input type="text" placeholder="Enter Percentage">
            </div>
            <button type="submit">SUBMIT APPLICATION</button>
        </form>
    </div>
    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', function() {
            document.body.classList.toggle('dark');
            if(document.body.classList.contains('dark')) {
                toggleBtn.textContent = '☀️ Light';
            } else {
                toggleBtn.textContent = '🌙 Dark';
            }
        });
        const form = document.getElementById('admissionForm');
        form.addEventListener('submit', function(e) {
            let isValid = true;
            document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');
            const fullName = document.getElementById('fullName').value.trim();
            if(fullName === '') {
                document.getElementById('nameError').textContent = 'Name is required and cannot be empty.';
                isValid = false;
            }
            const dob = document.getElementById('dob').value;
            if(dob === '') {
                document.getElementById('dobError').textContent = 'Date of Birth is required.';
                isValid = false;
            }
            const genderNode = document.querySelector('input[name="gender"]:checked');
            if(!genderNode) {
                document.getElementById('genderError').textContent = 'Please select your gender.';
                isValid = false;
            }
            const nationality = document.getElementById('nationality').value;
            if(nationality === '') {
                document.getElementById('nationalityError').textContent = 'Please select your nationality.';
                isValid = false;
            }
            const mobile = document.getElementById('mobile').value.trim();
            if(mobile === '') {
                document.getElementById('mobileError').textContent = 'Mobile number is required.';
                isValid = false;
            }
            const email = document.getElementById('email').value.trim();
            if(email !== '' && !email.includes('@')) {
                document.getElementById('emailError').textContent = 'Email must contain a valid "@" character.';
                isValid = false;
            }
            if(!isValid) {
                e.preventDefault();
            } else {
                alert('Form verified successfully via JavaScript!');
            }
        });
    </script>
</body>
</html>
